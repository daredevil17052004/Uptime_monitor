server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # ── API reverse proxy ───────────────────────────────────────────────────
    # Browser calls /api/... → nginx forwards to the backend container.
    # This means the browser only ever talks to one origin (port 80), which
    # avoids CORS issues entirely in production.
    location /api {
        proxy_pass         http://backend:3001;
        proxy_http_version 1.1;

        # Forward real client info to the backend
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Reasonable timeout — higher than the 10s ping timeout in the backend
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # Also proxy the health endpoint so Docker healthchecks work via nginx
    location /health {
        proxy_pass http://backend:3001/health;
    }

    # ── SPA fallback ────────────────────────────────────────────────────────
    # Any path that isn't a real file falls back to index.html so React
    # can handle client-side routing (useful when you add routes later).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Performance & security ──────────────────────────────────────────────
    server_tokens off;

    # Gzip static assets
    gzip            on;
    gzip_vary       on;
    gzip_min_length 1024;
    gzip_types      text/plain text/css application/json
                    application/javascript text/javascript
                    image/svg+xml;

    # Cache hashed assets aggressively (Vite adds content hashes to filenames)
    location ~* \.(js|css|woff2|png|svg|ico)$ {
        expires    1y;
        add_header Cache-Control "public, immutable";
    }
}
